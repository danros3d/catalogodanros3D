<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Administración · Dan Ros 3D</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">DAN ROS <span>3D</span></a><a href="./">Ver catálogo ↗</a></header><main class="admin"><h1>Tu catálogo.</h1><p class="muted">Acceso exclusivo para administradores autorizados.</p><p id="status" role="status" aria-live="polite"></p><form id="login" class="panel"><h2>Iniciar sesión</h2><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button class="primary">Entrar</button></div></form><section id="dashboard" hidden><div class="actions"><button id="new">Nuevo producto</button><button id="logout">Cerrar sesión</button></div><form id="editor" class="panel"><h2 id="editor-title">Nuevo producto</h2><div class="form-grid"><label>Nombre<input id="name" maxlength="120" required></label><label>Categoría<input id="category" maxlength="80" required placeholder="Escribe una categoría"></label><label>Precio en MXN<input id="price" type="number" min="0.01" max="9999999.99" step="0.01" required></label><label>Fotografía (JPEG, PNG o WebP; máximo 5 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><label>Descripción<textarea id="description" maxlength="2000" required></textarea></label><label><input id="visible" type="checkbox" checked style="display:inline;width:auto"> Visible en el catálogo</label><label><input id="remove-photo" type="checkbox" style="display:inline;width:auto"> Retirar la fotografía actual</label><div class="actions"><button id="save" class="primary">Guardar producto</button></div></form><h2>Productos</h2><div id="admin-products"></div></section></main><script type="module" src="admin.js"></script></body></html>
